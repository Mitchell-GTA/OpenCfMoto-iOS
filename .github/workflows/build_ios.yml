name: Build & Test iOS (OpenCfMoto-iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilar y Testear en Mac (GitHub Cloud)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Versión de Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Ejecutar Tests Unitarios del Protocolo PXC
        run: swift test -v

      - name: Compilar y Generar Instalable IPA (.ipa)
        run: |
          chmod +x tools/build_ipa.sh
          ./tools/build_ipa.sh

      - name: Subir Instalable IPA a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-iOS-IPA
          path: OpenCfMoto.ipa
          retention-days: 30

      - name: Publicar en GitHub Releases (Descarga pública sin iniciar sesión)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "OpenCfMoto iOS (Última versión)"
          body: "Instalable OpenCfMoto.ipa generado automáticamente por GitHub Actions para iPhone."
          files: OpenCfMoto.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
