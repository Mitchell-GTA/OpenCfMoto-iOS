name: Build & Test iOS (OpenCfMoto-iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilar y Testear en Mac (GitHub Cloud)
    runs-on: macos-14

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Versión de Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version
          swift --version

      - name: Ejecutar Tests Unitarios del Protocolo PXC
        run: swift test

      - name: Compilar y Generar Instalable IPA (.ipa)
        run: |
          chmod +x tools/build_ipa.sh
          ./tools/build_ipa.sh

      - name: Subir Instalable IPA a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-iOS-IPA
          path: OpenCfMoto.ipa
          retention-days: 30
